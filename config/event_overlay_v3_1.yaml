  tier_1:
    - cninfo.com.cn
    - sse.com.cn
    - szse.cn
    - gov.cn
  tier_2:
    - cs.com.cn
    - stcn.com
    - cnstock.com
  tier_3:
    - eastmoney.com
    - 10jqka.com.cn
    - sina.com.cn
  tier_4:
    - unknown
freshness:
  default_hours: 72
  announcement_hours: 168
  market_news_hours: 36
  unknown_publish_time_eligible: false
  announcement_source_types:
    - 交易所公告
    - 公司公告
    - 政府公告
    - 定期报告
    - 临时公告
