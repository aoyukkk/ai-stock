  model: deepseek-v4-flash
  max_uses: 2
  max_tokens: 10000
  max_continuations: 2
  workers: 4
scoring:
  mode: CONFIDENCE_GATED_EVENT_DELTA_V3_1
  max_event_delta: 8.0
  risk_penalties:
    ALLOW: 0.0
    PROMOTE: 0.0
    KEEP: 0.0
    DEMOTE: 0.0
    WATCH_ONLY: -4.0
    BLOCK: -100.0
