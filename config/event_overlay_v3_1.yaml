  search_contract: FLASH_DIRECT_SEARCH_CONTRACT_V7_NON_THINKING_SERVER_TOOL_LOOP
production_or_shadow: SHADOW
screening:
  input_top_n: 100
  output_top_n: 20
  pro_max_n: 20
  retry_count: 1
  max_sources_per_stock: 8
  max_events_per_stock: 5
  timeout_seconds: 120
  confidence_discount_direct_search: 0.70
web_search:
