review:
  enabled: true
  use_mock_llm_summary: true
  prediction_horizon_days: 1
  default_account_type: ai_simulation

scoring:
  prediction_accuracy_weight: 0.30
  order_price_quality_weight: 0.30
  portfolio_performance_weight: 0.25
  risk_control_weight: 0.15

order_price_quality:
  filled_score: 80
  missed_but_good_price_score: 60
  too_aggressive_penalty: 20
  too_conservative_penalty: 15
  risk_avoided_bonus: 10

thresholds:
  good_review_score: 80
  neutral_review_score: 60
  max_acceptable_drawdown_percent: 8

selection_performance:
  enabled: true
  minimum_recommendation_score: 60
  default_lookback_value: 5
  default_lookback_unit: TRADING_DAYS
  max_lookback_value: 120
  default_return_basis: NEXT_OPEN
  default_selection_scope: FINAL_CANDIDATES
  default_weighting_mode: EQUAL_WEIGHT
  auto_refresh_after_data_ready: true
  min_coverage_ratio: 0.95
  include_zero_position_stocks: true
  include_risk_blocked_stocks: true
  auto_export_excel: false
