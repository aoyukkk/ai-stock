data_sources:
  adapter_required: true
  mode: manual_debug
  phase0_mode: manual_debug_with_mock_fallback

  market_primary:
    provider: tushare
    enabled: true
    manual_only: true

  market_history:
    provider: tushare
    enabled: true
    manual_only: true

  market_backup:
    - provider: baostock
      enabled: true
      manual_only: true
    - provider: akshare
      enabled: false
      manual_only: true
      reason: "Disabled due to EastMoney/proxy route issue"

  market_fallback:
    - provider: mock
      enabled: true

  ifind:
    enabled: false
    mode: shadow
    integration_mode: SHADOW
    manual_only: true
    use_for_daily: false
    use_for_realtime: false
    use_for_minute: false
    use_for_order_book: false
    use_for_auction: false
    use_for_index: false
    use_for_industry: false
    use_for_concept: false
    use_for_fundamental: false
    use_for_event: false
    use_for_macro: false
    use_for_overseas: false
    reason: "Verified HTTP index/realtime/minute adapters are available but production routing remains disabled"

  ifind_runtime:
    enabled: false
    max_qps: 1
    min_interval_ms: 1000
    timeout_seconds: 30
    sequential_calls: true
    cache_enabled: true
    max_batch_codes_realtime: 4
    max_batch_codes_minute: 1
    max_minute_range_minutes: 240
    realtime_cache_ttl_seconds: 15
    minute_cache_ttl_seconds: 60
    index_cache_ttl_seconds: 30
    fallback_provider: tushare
    quota_guard_enabled: true
    auto_refresh_enabled: false

  tushare:
    enabled: true
    manual_only: true
    token_env: TUSHARE_TOKEN
    cache_enabled: true
    cache_path: data/cache/tushare
    request_interval_seconds: 0.25
    max_retry: 3
    timeout_seconds: 30
    permission_probe_enabled: true

  akshare:
    enabled: false
    manual_only: true
    reason: "Disabled due to EastMoney/proxy route issue"
    cache_enabled: true
    cache_path: data/cache/akshare
    request_interval_seconds: 0.2
    proxy_mode: env
    allow_no_proxy_test: true
    request_timeout_seconds: 10

  baostock:
    enabled: true
    manual_only: true
    cache_enabled: true
    cache_path: data/cache/baostock
    request_interval_seconds: 0.2
    max_lookback_days: 15

  news:
    - provider: ths_news
      enabled: false
    - provider: jinshi
      enabled: false
    - provider: mock
      enabled: true

  overseas:
    - provider: okx
      enabled: false
    - provider: mock
      enabled: true
