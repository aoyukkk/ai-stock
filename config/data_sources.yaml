data_sources:
  adapter_required: true
  mode: manual_debug
  phase0_mode: manual_debug_with_mock_fallback

  market_primary:
    provider: tushare
    enabled: true
    manual_only: true

  market_history:
    provider: tushare
    enabled: true
    manual_only: true

  market_backup:
    - provider: baostock
      enabled: true
      manual_only: true
    - provider: akshare
      enabled: false
      manual_only: true
      reason: "Disabled due to EastMoney/proxy route issue"

  market_fallback:
    - provider: mock
      enabled: true

  ifind:
    enabled: false
    reason: "iFinD API not approved yet"

  tushare:
    enabled: true
    manual_only: true
    token_env: TUSHARE_TOKEN
    cache_enabled: true
    cache_path: data/cache/tushare
    request_interval_seconds: 0.25
    max_retry: 3
    timeout_seconds: 30
    permission_probe_enabled: true

  akshare:
    enabled: false
    manual_only: true
    reason: "Disabled due to EastMoney/proxy route issue"
    cache_enabled: true
    cache_path: data/cache/akshare
    request_interval_seconds: 0.2
    proxy_mode: env
    allow_no_proxy_test: true
    request_timeout_seconds: 10

  baostock:
    enabled: true
    manual_only: true
    cache_enabled: true
    cache_path: data/cache/baostock
    request_interval_seconds: 0.2
    max_lookback_days: 15

  news:
    - provider: ths_news
      enabled: false
    - provider: jinshi
      enabled: false
    - provider: mock
      enabled: true

  overseas:
    - provider: okx
      enabled: false
    - provider: mock
      enabled: true
