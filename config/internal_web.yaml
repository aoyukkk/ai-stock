internal_web:
  enabled: false
  runtime_mode: INTERNAL_WEB_SERVER
  origin:
    host: 127.0.0.1
    port: 8080
    workers: 1
  authentication:
    mode: LOCAL_SHARED_PASSWORD
    session_hours: 12
    shared_username: partners
    shared_identity_role: TRADER
    local_password_enabled: true
    force_password_change_on_first_login: false
    local_bypass_enabled: false
  request_security:
    max_body_bytes: 10485760
    swagger_enabled: false
    wildcard_cors_enabled: false
  sqlite:
    wal_enabled: true
    busy_timeout_seconds: 30
  scheduler_enabled: false
  real_trading_enabled: false
