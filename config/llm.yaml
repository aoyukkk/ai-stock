llm_gateway:
  required: true
  phase0_mode: mock_only
  request_hash_cache_enabled: true
  json_schema_required: true
  parse_failure_fallback_action: WATCH_ONLY

llm:
  mock_only: true
  default_provider: mock
  default_model: mock-chat

  providers:
    deepseek:
      enabled: false
      api_key_env: DEEPSEEK_API_KEY
    openai:
      enabled: false
      api_key_env: OPENAI_API_KEY
    claude:
      enabled: false
      api_key_env: CLAUDE_API_KEY
    qwen:
      enabled: false
      api_key_env: QWEN_API_KEY
    mock:
      enabled: true

  fallback:
    primary: mock
    secondary: mock
    final: mock

  cache:
    enabled: true
    ttl_minutes: 30
