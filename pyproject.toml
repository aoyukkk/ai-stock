[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-trader-assistant"
version = "1.0.0"
description = "A-share trader daily screening workbench desktop application."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6.0,<7.0",
    "python-dotenv>=1.0,<2.0",
    "fastapi>=0.115,<1.0",
    "uvicorn>=0.30,<1.0",
    "SQLAlchemy>=2.0,<3.0",
    "openpyxl>=3.1,<4.0",
    "pandas>=2.2,<4.0",
    "pyarrow>=18,<24",
    "scikit-learn>=1.5,<2.0",
    "matplotlib>=3.9,<4.0",
    "torch>=2.6,<3.0",
    "tushare>=1.4,<2.0",
    "PyJWT[crypto]>=2.10,<3.0",
    "argon2-cffi>=23.1,<26.0",
    "pywin32>=306; platform_system == 'Windows'",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
